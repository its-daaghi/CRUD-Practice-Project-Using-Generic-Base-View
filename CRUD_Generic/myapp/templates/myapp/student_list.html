{% extends 'myapp/base.html' %}

{% block content %}


<div class="container mt-4">
     <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Student List</h2>
        <a href="{% url 'student_add' %}" class="btn btn-primary">Add Student</a>
     </div>
<table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Roll</th>
      <th scope="col">Marks</th>
      <th scope="col">View</th>
    </tr>
  </thead>

  <tbody>
    {% for student in students %}
    <tr>
      <td>{{ student.id }}</td>
      <td>{{ student.name }}</td>
        <td>{{ student.roll }}</td>
        <td>{{ student.marks }}</td>
        <td>
        <a href="{% url 'student_detail' student.pk %}" class="btn btn-info btn-sm">Detail</a>
        <a href="{% url 'student_update' student.pk %}" class="btn btn-warning btn-sm">Update</a>
        <a href="{% url 'student_delete' student.pk %}" class="btn btn-danger btn-sm">Delete</a> 
      </td> 
    </tr>
     {% endfor %}
      
  </tbody>
</table>
</div>
{% endblock %}
