{% extends 'myapp/base.html' %}

{% block content %}

<a href="{% url 'student_add' %}">Add Student</a>

<div class="container mt-4">
    <h2>Student List</h2>
<table class="table table-hover">
  <thead>
    <tr>
      <th scope="col">#</th>
      <th scope="col">Name</th>
      <th scope="col">Roll</th>
      <th scope="col">Marks</th>
      <th scope="col">View</th>
    </tr>
  </thead>

  <tbody>
    {% for student in students %}
    <tr>
      <td>{{ student.id }}</td>
      <td>{{ student.name }}</td>
        <td>{{ student.roll }}</td>
        <td>{{ student.marks }}</td>
        <td>
        <a href="{% url 'student_detail' student.pk %}" class="btn btn-info btn-sm">Detail</a>
        {% comment %} <a href="{% url 'student_update' student.pk %}" class="btn btn-warning btn-sm">Update</a>
        <a href="{% url 'student_delete' student.pk %}" class="btn btn-danger btn-sm">Delete</a> {% endcomment %}
      </td>
    </tr>
     {% endfor %}
      
  </tbody>
</table>
</div>
{% endblock %}
